version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build:
      context: ./worker
    env_file:
      - .env
    environment:
      HF_IMAGE_MODEL: runwayml/stable-diffusion-v1-5
      HF_API_TOKEN: ${HF_API_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/tmp
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
    environment:
      PORT: 4000
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      SD_WORKER_URL: http://worker:8000
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      - redis
      - worker
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
